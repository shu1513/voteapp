# Render Blueprint for the first public deploy (docs/deploy-render.md is the
# runbook; docs/deploy-checklist.md stays the platform-agnostic reference).
#
# Topology: Cloudflare (electionssimplified.com) fronts everything with a Worker
# that routes /api/* and /sitemap.xml to voteapp-api and everything else to
# voteapp-ssr (infra/cloudflare/router-worker.js). Cookies stay same-origin.
# Client IP: the Worker copies Cloudflare's CF-Connecting-IP into the custom
# X-Voteapp-Client-IP header (stripping client-supplied copies), which both
# servers trust via ADDRESS_API_TRUSTED_CLIENT_IP_HEADER. The reserved
# CF-Connecting-IP name itself is unusable past the Worker: the
# *.onrender.com origins sit behind Render's own Cloudflare, which 403s
# outside clients presenting that header — the SSR loader's relay to the
# API's public host would break (and the value would be overwritten anyway).
#
# Secrets (sync: false) are entered in the Render dashboard: AWS SES
# send-only key pair, the optional EDGE_SHARED_SECRET, and
# GOOGLE_PLACES_API_KEY (optional to boot, but address autocomplete 500s
# without it). NOTE: a
# Blueprint sync only prompts for sync: false vars present at blueprint
# creation — ones added later must be entered manually on the service
# (docs/deploy-render.md "Direct onrender.com access" has the sequence).
#
# PLANS: everything below is on free plans so the first deploy needs no card
# on file. Free web services spin down after ~15 idle minutes (cold start on
# the next request) and the free Postgres instance EXPIRES ~30 DAYS after
# creation unless upgraded — upgrade the DB plan (and the web services, and
# uncomment the worker + cron sections) once billing is set up.

services:
  # ---------------------------------------------------------------- API ----
  - name: voteapp-api
    type: web
    runtime: node
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run address:api
    # DB-backed read: proves Postgres connectivity, not just an open port.
    healthCheckPath: /api/research-areas
    envVars:
      # DATABASE_URL is the OWNER connection string (Blueprint-managed, used
      # by migrations/workers). To run the API as the least-privilege
      # voteapp_api role instead, add API_DATABASE_URL directly in the Render
      # dashboard (docs/postgres-api-role.md) — deliberately NOT declared
      # here: dashboard-only vars survive Blueprint syncs untouched, while a
      # declared-but-unsynced var would re-prompt on every sync.
      - key: DATABASE_URL
        fromDatabase:
          name: voteapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: voteapp-redis
          type: keyvalue
          property: connectionString
      - key: ADDRESS_API_HOST
        value: 0.0.0.0
      - key: ADDRESS_API_PORT
        value: "10000"
      - key: ADDRESS_API_TRUSTED_CLIENT_IP_HEADER
        value: X-Voteapp-Client-IP
      # Shared with the Cloudflare Worker (secret var of the same name) and
      # the SSR service below: the API only trusts X-Voteapp-Client-IP on
      # requests carrying the matching X-Edge-Secret header, so a direct
      # *.onrender.com hit can no longer spoof per-IP rate limiting. Must be
      # >= 32 chars, and REQUIRED here: with DEPLOY_ENV=production and the
      # trusted header set, the server refuses to boot without it (nothing
      # shields the custom header from direct *.onrender.com spoofing).
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: AUTH_PUBLIC_BASE_URL
        value: https://electionssimplified.com
      - key: SITE_ORIGIN
        value: https://electionssimplified.com
      # Browsers send an Origin header on every non-GET request even
      # same-origin, so the site's own origin must be allowlisted or all
      # browser POST/PUT/DELETE calls 403. The server also derives this from
      # SITE_ORIGIN; the explicit value guards against config drift.
      # www is included even though the edge Worker 301s it to the apex:
      # a POST that somehow originates from a www page must not 403.
      - key: ADDRESS_API_ALLOWED_ORIGINS
        value: https://electionssimplified.com,https://www.electionssimplified.com
      - key: AUTH_SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTH_FROM_EMAIL
        value: noreply@electionssimplified.com
      - key: AUTH_REPLY_TO_EMAIL
        value: contact@electionssimplified.com
      - key: AUTH_SES_REGION
        value: us-east-2
      - key: NOTIFICATIONS_UNSUBSCRIBE_URL
        value: https://electionssimplified.com/api/email/unsubscribe
      - key: DEPLOY_ENV
        value: production
      # Google Places key for /api/address/autocomplete (+retrieve). Without
      # it the endpoint 500s ("Address autocomplete is not configured") and
      # the frontend silently disables the address dropdown for the session.
      # sync: false vars added after blueprint creation are NOT prompted for
      # by a sync — enter the value manually on the voteapp-api service.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # --- Finance read flags -------------------------------------------
      # Display-only switches: they gate whether stored finance data is
      # returned to the cards, and cost nothing. Without them production
      # holds the data but renders no money at all, which looks like a
      # failed data load. Declared here so a deploy turns them on rather
      # than someone remembering 35 dashboard edits.
      #
      # The matching *_SYNC_ENABLED / *_RAW_DATA_REFRESH_ENABLED flags are
      # deliberately NOT here: those fetch from state disclosure sites and
      # can get us rate-limited or blocked, so they stay opt-in per run.
      - key: ALASKA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: ARIZONA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: CALIFORNIA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: CANDIDATE_FINANCE_ENABLED
        value: "true"
      - key: COLORADO_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: CONNECTICUT_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: DISTRICT_OF_COLUMBIA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: FLORIDA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: HAWAII_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: HOUSTON_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: ILLINOIS_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: INDIANA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: KENTUCKY_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: LOS_ANGELES_CITY_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: LOUISIANA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: MAINE_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: MARYLAND_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: MASSACHUSETTS_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: MICHIGAN_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: MINNESOTA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: NEBRASKA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: NEW_JERSEY_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: NEW_MEXICO_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: NEW_YORK_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: NEW_YORK_CITY_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: NORTH_CAROLINA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: OHIO_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: OKLAHOMA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: OREGON_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: PENNSYLVANIA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: TENNESSEE_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: TEXAS_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: UTAH_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: VERMONT_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: VIRGINIA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: WASHINGTON_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: WISCONSIN_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - fromGroup: voteapp-shared

  # ---------------------------------------------------------------- SSR ----
  - name: voteapp-ssr
    type: web
    runtime: node
    region: ohio
    plan: free
    # No rootDir: Render makes files outside the root directory unavailable
    # at build and runtime, and this service needs the repo-root npm
    # workspace (lockfile + packages/api-client). Commands run from the repo
    # root and scope to the frontend workspace instead; buildFilter keeps
    # deploys triggered only by frontend-relevant changes.
    buildCommand: npm ci && npm run build --workspace frontend
    startCommand: npm run start --workspace frontend
    buildFilter:
      paths:
        - frontend/**
        - packages/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      # FREE-TIER CONSTRAINT: free web services can SEND private-network
      # requests but cannot RECEIVE them, so voteapp-api's private hostname
      # is unreachable until it moves to a paid instance type. Loaders use
      # the API's public hostname instead, resolved by Render itself
      # (RENDER_EXTERNAL_HOSTNAME via fromService/envVarKey) — nothing
      # hardcodes the generated hostname, so it survives service recreation
      # and keeps preview environments pointed at their own API.
      - key: API_PUBLIC_HOST
        fromService:
          name: voteapp-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # After upgrading voteapp-api to a paid plan, uncomment: the private
      # hostport outranks API_PUBLIC_HOST in the loader, so this one edit
      # moves loader traffic onto the private network.
      # - key: API_INTERNAL_HOSTPORT
      #   fromService:
      #     name: voteapp-api
      #     type: web
      #     property: hostport
      # Free instances cold-start (~1 minute) after 15 idle minutes, and the
      # loaders point at exactly such an instance; without headroom every
      # wake-up request 504s at the loader's 10s default. Drop both timeout
      # overrides once the API is paid/always-on.
      - key: API_LOADER_TIMEOUT_MS
        value: "75000"
      # Baked into the browser bundle at build time (Vite): client-side API
      # calls (address search, auth) need the same cold-start headroom.
      - key: VITE_API_TIMEOUT_MS
        value: "75000"
      - key: ADDRESS_API_TRUSTED_CLIENT_IP_HEADER
        value: X-Voteapp-Client-IP
      # Same value as the API's secret (referenced, not duplicated): loaders
      # hit the API's public host, so their relayed client-IP header needs
      # the same proof-of-edge the Worker attaches.
      - key: EDGE_SHARED_SECRET
        fromService:
          name: voteapp-api
          type: web
          envVarKey: EDGE_SHARED_SECRET

  # ------------------------------------------------------------- workers ----
  # One process runs all three notification scheduler workers and re-asserts
  # their recurring BullMQ jobs on every boot (idempotent upserts).
  # COMMENTED OUT for the card-less free-tier launch: background workers and
  # cron jobs require a paid plan. Uncomment (and re-sync the blueprint) once
  # billing is set up. Until then no digest/alert/reminder emails send — SES
  # is still sandboxed at launch anyway.
  # - name: voteapp-notification-workers
  #   type: worker
  #   runtime: node
  #   region: ohio
  #   plan: starter
  #   rootDir: backend
  #   buildCommand: npm ci
  #   startCommand: npm run notifications:workers
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: voteapp-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         name: voteapp-redis
  #         type: keyvalue
  #         property: connectionString
  #     - key: AUTH_FROM_EMAIL
  #       value: noreply@electionssimplified.com
  #     - key: AUTH_REPLY_TO_EMAIL
  #       value: contact@electionssimplified.com
  #     - key: AUTH_SES_REGION
  #       value: us-east-2
  #     - key: AUTH_PUBLIC_BASE_URL
  #       value: https://electionssimplified.com
  #     - key: NOTIFICATIONS_UNSUBSCRIBE_URL
  #       value: https://electionssimplified.com/api/email/unsubscribe
  #     - key: DEPLOY_ENV
  #       value: production
  #     - fromGroup: voteapp-shared

  # ------------------------------------------------------------------ cron ----
  # COMMENTED OUT with the worker above (paid plan required).
  # - name: voteapp-notifications-prune
  #   type: cron
  #   runtime: node
  #   region: ohio
  #   schedule: "0 6 * * *"
  #   rootDir: backend
  #   buildCommand: npm ci
  #   startCommand: npm run notifications:prune
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: voteapp-db
  #         property: connectionString

  # ------------------------------------------------------------- key value ----
  - name: voteapp-redis
    type: keyvalue
    region: ohio
    plan: free
    maxmemoryPolicy: noeviction
    # Private-network access only; nothing outside Render needs Redis.
    ipAllowList: []

databases:
  - name: voteapp-db
    region: ohio
    # FREE PLAN EXPIRES ~30 days after creation (instance deleted). Upgrade
    # to basic-256mb or larger before expiry once billing is set up.
    plan: free

envVarGroups:
  - name: voteapp-shared
    envVars:
      # Send-only SES IAM key (ses:SendEmail only).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Shared by the API server (verify) and every mailer (sign).
      - key: NOTIFICATIONS_UNSUBSCRIBE_SECRET
        generateValue: true
