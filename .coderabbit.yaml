# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
  review_status: true
  tools:
    # The workspace root pulls in the mobile (Expo) dependency tree, and
    # CodeRabbit's sandboxed ESLint install times out on it every PR. Only
    # mobile has an ESLint config, and mobile CI already runs npm run lint.
    eslint:
      enabled: false
    # CodeRabbit's hosted Checkov 3.3.8 launcher currently fails before
    # scanning (`ModuleNotFoundError: checkov`). This repository has no
    # Terraform, Docker, Kubernetes, or other IaC for Checkov to cover, so do
    # not run the broken hosted tool against package manifests.
    checkov:
      enabled: false

chat:
  auto_reply: true
