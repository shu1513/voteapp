name: Bug report
description: Something in the app or the code does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, what you expected.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL or command
      placeholder: https://electionssimplified.com/... or `npm run ...`
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Website, Mobile app, Backend or pipeline, Docs]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Browser, device, or Node version
