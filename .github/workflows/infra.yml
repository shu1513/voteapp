name: Infra

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker tests
        run: node --test
