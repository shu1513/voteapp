name: Backend

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migration file check
        run: npm run db:migrate:check-files

      - name: Unit tests
        run: npm run test

      - name: Auth proxy E2E
        run: npm run test:e2e:proxy

  migrate:
    name: Apply migrations from empty database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voteapp
          POSTGRES_PASSWORD: voteapp
          POSTGRES_DB: voteapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voteapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply all migrations against empty database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # The parity test needs a live Postgres, which only this job provides;
      # the unit-test job skips it because DATABASE_URL is unset there.
      - name: Finance label normalization parity
        run: npx vitest run tests/pipeline/finance/normalizeFinanceLabelParity.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp
