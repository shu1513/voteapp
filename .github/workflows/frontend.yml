name: Frontend

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The lockfile lives at the repo root (npm workspaces: frontend +
      # packages/*), so install from there; scripts still run in frontend/.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The production build exercises code paths typecheck and vitest do
      # not (react-router/vite bundling, CSS pipeline); Sentry source-map
      # upload stays off because SENTRY_AUTH_TOKEN is absent in CI.
      - name: Production build
        run: npm run build
